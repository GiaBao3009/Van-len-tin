<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💌 Happy Valentine's Day 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;600&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #ffe4e9 0%, #ffc1cc 50%, #ffb0bc 100%);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ===== CANVAS ===== */
        #heartCanvas,
        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #heartCanvas {
            z-index: 0;
        }

        #confettiCanvas {
            z-index: 50;
        }

        /* ===== SPARKLES ===== */
        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: sparkle-fade .7s ease-out forwards;
        }

        @keyframes sparkle-fade {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }

            100% {
                opacity: 0;
                transform: scale(0) translate(var(--tx), var(--ty));
            }
        }

        /* ===== FLOATING HEARTS ===== */
        .floating-heart {
            position: fixed;
            bottom: -40px;
            animation: float-up linear forwards;
            pointer-events: none;
            z-index: 5;
            opacity: .7;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0) scale(1);
                opacity: .7;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg) scale(.3);
                opacity: 0;
            }
        }

        /* ==========================================
       QUESTION SECTION
    ========================================== */
        #questionSection {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 36px 24px;
            background: rgba(255, 255, 255, .28);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, .45);
            box-shadow: 0 8px 40px rgba(200, 80, 100, .16);
            width: 88vw;
            max-width: 380px;
            transition: opacity .8s ease, transform .8s ease;
        }

        #questionSection.hide {
            opacity: 0;
            transform: scale(.8) translateY(30px);
            pointer-events: none;
        }

        #questionSection h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #c0392b;
            margin-bottom: 8px;
        }

        #questionSection p {
            font-size: 1.05rem;
            color: #6b2d3e;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-yes {
            padding: 14px 44px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 22px rgba(231, 76, 60, .45);
            animation: pulse 1.2s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.1)
            }
        }

        .btn-no {
            padding: 12px 32px;
            font-size: .95rem;
            font-weight: 600;
            color: #c0392b;
            background: #fff;
            border: 2px solid #e74c3c;
            border-radius: 50px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: left .12s ease, top .12s ease;
        }

        /* ==========================================
       ENVELOPE ANIMATION — just the envelope opening, then fades out
    ========================================== */
        #envelopeSection {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .6s ease;
        }

        #envelopeSection.show {
            opacity: 1;
            pointer-events: auto;
        }

        #envelopeSection.fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity .8s ease;
        }

        .envelope-container {
            position: relative;
            width: 80vw;
            max-width: 320px;
            aspect-ratio: 1.5 / 1;
            perspective: 1000px;
        }

        .envelope-body {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #f2c4c4 0%, #e8a8a8 100%);
            border-radius: 0 0 14px 14px;
            box-shadow: 0 8px 36px rgba(180, 60, 80, .22);
        }

        .envelope-body::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .04));
            clip-path: polygon(0 100%, 50% 0%, 100% 100%);
            border-radius: 0 0 14px 14px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(180deg, #dfa0a0, #f2c4c4);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top center;
            transition: transform 1s cubic-bezier(.4, 0, .2, 1);
            z-index: 3;
        }

        .envelope-flap.open {
            transform: rotateX(180deg);
        }

        .seal {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            z-index: 4;
            filter: drop-shadow(0 2px 6px rgba(200, 50, 50, .35));
            transition: opacity .5s ease .5s;
        }

        .seal.hide {
            opacity: 0;
        }

        /* ==========================================
       LETTER SECTION — full-screen scrollable card (appears AFTER envelope)
    ========================================== */
        #letterSection {
            position: fixed;
            inset: 0;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 16px 30px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            opacity: 0;
            pointer-events: none;
            transition: opacity .8s ease;
        }

        #letterSection.show {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            background: #fffbf6;
            width: 92vw;
            max-width: 380px;
            border-radius: 16px;
            box-shadow: 0 6px 32px rgba(180, 60, 80, .18);
            padding: 30px 22px 32px;
            transform: translateY(40px) scale(.95);
            opacity: 0;
            transition: transform .8s cubic-bezier(.4, 0, .2, 1), opacity .8s ease;
            position: relative;
        }

        .letter-card.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Decorative top edge */
        .letter-card::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 10%;
            right: 10%;
            height: 16px;
            background: repeating-linear-gradient(90deg, transparent, transparent 8px, #fdd 8px, #fdd 10px,
                    transparent 10px, transparent 18px);
            border-radius: 8px 8px 0 0;
        }

        .letter-header {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #c0392b;
            text-align: center;
            margin-bottom: 18px;
        }

        .letter-body {
            font-size: .95rem;
            line-height: 1.9;
            color: #5a3040;
            white-space: pre-wrap;
            min-height: 60px;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #c0392b;
            margin-left: 2px;
            animation: blink .7s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ===== Gift Button ===== */
        .gift-btn {
            margin-top: 24px;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #e84393, #fd79a8);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(232, 67, 147, .4);
            animation: gift-bounce 1.5s ease-in-out infinite, gift-glow 2s ease-in-out infinite;
            opacity: 0;
            transform: scale(0);
            transition: opacity .5s ease, transform .5s cubic-bezier(.175, .885, .32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }

        .gift-btn.show {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes gift-bounce {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-6px) scale(1.05);
            }
        }

        @keyframes gift-glow {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(232, 67, 147, .4);
            }

            50% {
                box-shadow: 0 4px 32px rgba(232, 67, 147, .7), 0 0 60px rgba(253, 121, 168, .3);
            }
        }

        /* ==========================================
       GIFT BOX OVERLAY
    ========================================== */
        #giftOverlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease;
            padding: 20px;
        }

        #giftOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .gift-box {
            position: relative;
            width: 92vw;
            max-width: 360px;
            transform: scale(0);
            transition: transform .6s cubic-bezier(.175, .885, .32, 1.275);
        }

        #giftOverlay.show .gift-box {
            transform: scale(1);
        }

        .gift-lid {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            height: 50px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
            transition: transform .8s cubic-bezier(.4, 0, .2, 1), opacity .5s ease .3s;
        }

        .gift-lid.open {
            transform: translateY(-30px) rotateX(50deg);
            opacity: 0;
        }

        .gift-lid .ribbon {
            width: 20px;
            height: 100%;
            background: linear-gradient(180deg, #f1c40f, #f39c12);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .gift-lid .bow {
            font-size: 32px;
            position: relative;
            z-index: 3;
        }

        .gift-body {
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            min-height: 280px;
            border-radius: 0 0 12px 12px;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-body .ribbon-v {
            position: absolute;
            left: 50%;
            top: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(180deg, #f1c40f, #f39c12);
            transform: translateX(-50%);
        }

        .gift-paper {
            background: #fffdf8;
            width: 86%;
            min-height: 200px;
            border-radius: 8px;
            padding: 22px 18px;
            position: relative;
            z-index: 3;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .08);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .6s ease .8s, transform .6s ease .8s;
        }

        .gift-paper.show {
            opacity: 1;
            transform: translateY(0);
        }

        .gift-paper-header {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: #e84393;
            text-align: center;
            margin-bottom: 12px;
        }

        .gift-paper-body {
            font-size: .9rem;
            line-height: 1.8;
            color: #5a3040;
            white-space: pre-wrap;
        }

        .gift-close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .3);
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <canvas id="heartCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>

    <!-- QUESTION -->
    <div id="questionSection">
        <h1>💕 Happy Valentine 💕</h1>
        <p>Em có yêu anh không?</p>
        <div class="btn-group">
            <button class="btn-yes" id="btnYes">Có 💖</button>
            <button class="btn-no" id="btnNo">Không 🙅</button>
        </div>
    </div>

    <!-- ENVELOPE (just the animation, then fades away) -->
    <div id="envelopeSection">
        <div class="envelope-container">
            <div class="envelope-body">
                <div class="envelope-flap" id="flap"></div>
                <span class="seal" id="seal">❤️</span>
            </div>
        </div>
    </div>

    <!-- LETTER (full-screen scrollable, appears after envelope fades) -->
    <div id="letterSection">
        <div class="letter-card" id="letterCard">
            <div class="letter-header">Gửi người anh yêu 💌</div>
            <div class="letter-body" id="letterBody"></div>
        </div>
        <button class="gift-btn" id="giftBtn">🎁 Hộp quà bí mật</button>
    </div>

    <!-- GIFT BOX -->
    <div id="giftOverlay">
        <button class="gift-close-btn" id="giftCloseBtn">✕</button>
        <div class="gift-box">
            <div class="gift-lid" id="giftLid">
                <div class="ribbon"></div>
                <span class="bow">🎀</span>
            </div>
            <div class="gift-body">
                <div class="ribbon-v"></div>
                <div class="gift-paper" id="giftPaper">
                    <div class="gift-paper-header">🎁 Món quà dành cho vợ iuuu 🎁</div>
                    <div class="gift-paper-body" id="giftPaperBody"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================
           HEART RAIN CANVAS
        ========================================================== */
        const hCanvas = document.getElementById('heartCanvas');
        const hCtx = hCanvas.getContext('2d');
        const cCanvas = document.getElementById('confettiCanvas');
        const cCtx = cCanvas.getContext('2d');
        let hearts = [];

        function resizeAll() {
            hCanvas.width = cCanvas.width = window.innerWidth;
            hCanvas.height = cCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeAll);
        resizeAll();

        class Heart {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * hCanvas.width;
                this.y = init ? Math.random() * -hCanvas.height : -30;
                this.size = Math.random() * 12 + 6;
                this.speed = Math.random() * 1.2 + .6;
                this.opacity = Math.random() * .45 + .25;
                this.wobble = Math.random() * 1.5 - .75;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - .5) * .025;
                this.hue = Math.random() * 30 + 340;
            }
            update() {
                this.y += this.speed;
                this.x += Math.sin(this.angle) * this.wobble;
                this.angle += this.spin;
                if (this.y > hCanvas.height + 30) this.reset(false);
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * .3);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = `hsl(${this.hue},80%,65%)`;
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, s * .3);
                ctx.bezierCurveTo(-s, -s * .4, -s * .4, -s, 0, -s * .5);
                ctx.bezierCurveTo(s * .4, -s, s, -s * .4, 0, s * .3);
                ctx.fill();
                ctx.restore();
            }
        }

        const HEART_COUNT = Math.min(40, Math.floor(window.innerWidth / 12));
        for (let i = 0; i < HEART_COUNT; i++) hearts.push(new Heart());
        (function loop() {
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hearts.forEach(h => { h.update(); h.draw(hCtx); });
            requestAnimationFrame(loop);
        })();

        /* ==========================================================
           FLOATING CSS HEARTS
        ========================================================== */
        const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '💘', '💝', '🩷'];
        setInterval(() => {
            const el = document.createElement('span');
            el.className = 'floating-heart';
            el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 16 + 14) + 'px';
            const dur = Math.random() * 3 + 4;
            el.style.animationDuration = dur + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), dur * 1000);
        }, 700);

        /* ==========================================================
           SPARKLE TRAIL
        ========================================================== */
        const sparkleColors = ['#ff6b81', '#ff4757', '#ffa502', '#e84393', '#fd79a8'];
        let lastSparkle = 0;
        function createSparkle(x, y) {
            if (Date.now() - lastSparkle < 60) return;
            lastSparkle = Date.now();
            for (let i = 0; i < 2; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = x + 'px'; s.style.top = y + 'px';
                s.style.background = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                s.style.setProperty('--tx', (Math.random() * 50 - 25) + 'px');
                s.style.setProperty('--ty', (Math.random() * 50 - 25) + 'px');
                const sz = (Math.random() * 4 + 3) + 'px';
                s.style.width = sz; s.style.height = sz;
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 700);
            }
        }
        document.addEventListener('touchmove', e => {
            createSparkle(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        document.addEventListener('mousemove', e => createSparkle(e.clientX, e.clientY));

        /* ==========================================================
           RUNAWAY "NO" BUTTON
        ========================================================== */
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        let noCount = 0;
        const funnyTexts = [
            'Không 🙅', 'Chắc chưa? 😏', 'Suy nghĩ lại đi! 🥺',
            'Thật sao?? 😭', 'Anh buồn lắm 😢', 'Bấm "Có" đi mà~ 💔',
            'Lần cuối nha~ 🥹', 'Không được chọn đâu 😤'
        ];
        function runAway() {
            noCount++;
            btnNo.textContent = funnyTexts[Math.min(noCount, funnyTexts.length - 1)];
            btnYes.style.transform = `scale(${Math.min(1 + noCount * .1, 1.6)})`;
            const pad = 20;
            const nx = pad + Math.random() * (window.innerWidth - btnNo.offsetWidth - pad * 2);
            const ny = pad + Math.random() * (window.innerHeight - btnNo.offsetHeight - pad * 2);
            btnNo.style.position = 'fixed';
            btnNo.style.left = nx + 'px'; btnNo.style.top = ny + 'px';
            btnNo.style.zIndex = '30';
        }
        btnNo.addEventListener('mouseover', runAway);
        btnNo.addEventListener('touchstart', e => { e.preventDefault(); runAway(); }, { passive: false });
        btnNo.addEventListener('click', e => { e.preventDefault(); runAway(); });

        /* ==========================================================
           YES → ENVELOPE OPEN → LETTER APPEARS
        ========================================================== */
        const questionSection = document.getElementById('questionSection');
        const envelopeSection = document.getElementById('envelopeSection');
        const letterSection = document.getElementById('letterSection');
        const letterCard = document.getElementById('letterCard');
        const letterBody = document.getElementById('letterBody');
        const flap = document.getElementById('flap');
        const seal = document.getElementById('seal');
        const giftBtn = document.getElementById('giftBtn');

        btnYes.addEventListener('click', () => {
            // 1. Hide question
            questionSection.classList.add('hide');
            btnNo.style.display = 'none';

            // 2. Show envelope
            setTimeout(() => {
                envelopeSection.classList.add('show');

                // 3. Open flap
                setTimeout(() => {
                    flap.classList.add('open');
                    seal.classList.add('hide');

                    // 4. Fade out envelope, show letter section
                    setTimeout(() => {
                        envelopeSection.classList.add('fade-out');

                        setTimeout(() => {
                            letterSection.classList.add('show');
                            setTimeout(() => {
                                letterCard.classList.add('show');
                                // 5. Start typewriter
                                setTimeout(startTypewriter, 600);
                            }, 200);
                        }, 400);

                    }, 1200);
                }, 600);
            }, 800);

            setTimeout(launchConfetti, 1000);
        });

        /* ==========================================================
           TYPEWRITER
        ========================================================== */
        const loveLetterText = `Anh yêu Emm nhiều. Dù xa cỡ nào tình ta mãi chả xa xôi, nếu như có thứ gì tồn tại mãi mãi thì đó chỉ có thể làm tình cảm đôi ta anh hem biết viết lời đường mật chỉ biết là Anhh yêuuu Emmm nhiều lắm`;

        function startTypewriter() {
            let i = 0;
            const cursor = document.createElement('span');
            cursor.className = 'cursor-blink';
            letterBody.appendChild(cursor);

            function type() {
                if (i < loveLetterText.length) {
                    const ch = loveLetterText[i];
                    if (ch === '\n') {
                        letterBody.insertBefore(document.createElement('br'), cursor);
                    } else {
                        letterBody.insertBefore(document.createTextNode(ch), cursor);
                    }
                    i++;
                    setTimeout(type, '.!?,'.includes(ch) ? 160 : 40);
                } else {
                    setTimeout(() => {
                        cursor.remove();
                        giftBtn.classList.add('show');
                    }, 1500);
                }
            }
            type();
        }

        /* ==========================================================
           GIFT BOX
        ========================================================== */
        const giftOverlay = document.getElementById('giftOverlay');
        const giftLid = document.getElementById('giftLid');
        const giftPaper = document.getElementById('giftPaper');
        const giftPaperBody = document.getElementById('giftPaperBody');
        const giftCloseBtn = document.getElementById('giftCloseBtn');

        const giftText = `Làm phát nhá baeee sau qua anh sờ bim bím :>>>> Yêuuu emm`;

        giftBtn.addEventListener('click', () => {
            giftOverlay.classList.add('show');
            launchConfetti();
            setTimeout(() => {
                giftLid.classList.add('open');
                setTimeout(() => {
                    giftPaper.classList.add('show');
                    typeGiftText();
                }, 600);
            }, 500);
        });

        function typeGiftText() {
            giftPaperBody.innerHTML = '';
            let i = 0;
            const cursor = document.createElement('span');
            cursor.className = 'cursor-blink';
            giftPaperBody.appendChild(cursor);
            function type() {
                if (i < giftText.length) {
                    const ch = giftText[i];
                    if (ch === '\n') giftPaperBody.insertBefore(document.createElement('br'), cursor);
                    else giftPaperBody.insertBefore(document.createTextNode(ch), cursor);
                    i++;
                    setTimeout(type, '.!?,'.includes(ch) ? 140 : 35);
                } else {
                    setTimeout(() => cursor.remove(), 2000);
                }
            }
            type();
        }

        giftCloseBtn.addEventListener('click', () => {
            giftOverlay.classList.remove('show');
            setTimeout(() => {
                giftLid.classList.remove('open');
                giftPaper.classList.remove('show');
            }, 500);
        });

        /* ==========================================================
           CONFETTI
        ========================================================== */
        let confettiPieces = [], confettiRunning = false;

        class Confetti {
            constructor() {
                this.x = Math.random() * cCanvas.width;
                this.y = Math.random() * cCanvas.height * .35 - cCanvas.height * .1;
                this.w = Math.random() * 9 + 5; this.h = Math.random() * 5 + 3;
                this.vx = (Math.random() - .5) * 3.5; this.vy = Math.random() * 2.5 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - .5) * .18;
                this.color = `hsl(${Math.random() * 360},85%,65%)`;
                this.opacity = 1; this.life = Math.random() * 100 + 80; this.age = 0;
            }
            update() {
                this.x += this.vx; this.vy += .035; this.y += this.vy;
                this.angle += this.spin; this.age++;
                if (this.age > this.life * .7)
                    this.opacity = Math.max(0, 1 - (this.age - this.life * .7) / (this.life * .3));
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h); ctx.restore();
            }
            isDead() { return this.age >= this.life; }
        }

        function launchConfetti() {
            for (let i = 0; i < 120; i++) confettiPieces.push(new Confetti());
            if (!confettiRunning) { confettiRunning = true; animateConfetti(); }
            let b = 0;
            const iv = setInterval(() => {
                for (let i = 0; i < 50; i++) confettiPieces.push(new Confetti());
                if (++b >= 3) clearInterval(iv);
            }, 1000);
        }
        function animateConfetti() {
            cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
            confettiPieces.forEach(p => { p.update(); p.draw(cCtx); });
            confettiPieces = confettiPieces.filter(p => !p.isDead());
            if (confettiPieces.length) requestAnimationFrame(animateConfetti);
            else confettiRunning = false;
        }

        /* ==========================================================
           TOUCH HEART BURST
        ========================================================== */
        document.addEventListener('click', e => {
            for (let i = 0; i < 5; i++) {
                const h = document.createElement('span');
                h.className = 'floating-heart';
                h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                h.style.left = (e.clientX + Math.random() * 30 - 15) + 'px';
                h.style.bottom = (window.innerHeight - e.clientY) + 'px';
                h.style.fontSize = (Math.random() * 12 + 12) + 'px';
                const dur = Math.random() * 2 + 2;
                h.style.animationDuration = dur + 's';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), dur * 1000);
            }
        });
    </script>
